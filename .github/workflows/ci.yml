name: CI

on:
  push:
    branches: [main, feat/notifications-complete]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend/shared tests
        run: pnpm test
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run backend tests
        run: pnpm --dir backend test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_ACCESS_SECRET: test-access-secret-for-ci-only
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only
      - name: Build all frontend apps
        run: pnpm build
