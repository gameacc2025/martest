name: Runtime Validation

on:
  push:
    branches: [main, docs-runtime-e2e-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-runtime-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrations-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated architecture graph
        run: |
          node scripts/generate-architecture-graph.mjs --write
          git diff -- docs/architecture/DEPENDENCY_GRAPH.generated.mmd

      - name: Prepare disposable Compose environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=telecom
          POSTGRES_PASSWORD=ci_only_password_93a1c2
          POSTGRES_DB=telecom_marketplace
          EOF
          cp backend/.env.example backend/.env
          cat >> backend/.env <<'EOF'
          JWT_ACCESS_SECRET=ci_access_secret_only_32_chars_93a1
          JWT_REFRESH_SECRET=ci_refresh_secret_only_32_chars_93a1
          ALLOWED_ORIGINS=http://localhost:3001,http://localhost:3002,http://localhost:3003
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start PostgreSQL, backend, and all three panels
        run: docker compose up -d --build

      - name: Wait for all service health endpoints
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:3000/health >/dev/null \
              && curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:3001/health >/dev/null \
              && curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:3002/health >/dev/null \
              && curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:3003/health >/dev/null; then
              echo "Backend and all three panels are healthy."
              exit 0
            fi
            if (( attempt % 6 == 0 )); then
              echo "Waiting for service health (attempt ${attempt}/36)."
              docker compose ps
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color postgres backend website company admin
          exit 1

      - name: Verify all migrations are applied to PostgreSQL
        run: docker compose exec -T backend npx prisma migrate status

      - name: Install isolated browser-test dependency
        run: npm install --prefix e2e --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Run browser smoke tests against all panels and API proxies
        run: npm --prefix e2e test
        env:
          CI: true
          WEBSITE_URL: http://localhost:3001/
          COMPANY_URL: http://localhost:3002/
          ADMIN_URL: http://localhost:3003/
          E2E_ADMIN_PHONE: 09120000000
          E2E_ADMIN_PASSWORD: Admin@123456

      - name: Collect service logs on failure
        if: failure()
        shell: bash
        run: |
          if [ -f .env ]; then docker compose logs --no-color postgres backend website company admin; fi

      - name: Tear down disposable environment
        if: always()
        shell: bash
        run: |
          if [ -f .env ]; then docker compose down -v; fi
