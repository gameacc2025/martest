name: Runtime Validation

on:
  push:
    branches: [main, runtime-validation-main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-runtime-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare disposable Compose environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=telecom
          POSTGRES_PASSWORD=ci_only_password_93a1c2
          POSTGRES_DB=telecom_marketplace
          EOF
          cp backend/.env.example backend/.env
          cat >> backend/.env <<'EOF'
          JWT_ACCESS_SECRET=ci_access_secret_only_32_chars_93a1
          JWT_REFRESH_SECRET=ci_refresh_secret_only_32_chars_93a1
          ALLOWED_ORIGINS=http://localhost:3001,http://localhost:3002,http://localhost:3003
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start PostgreSQL, backend, and all three panels
        run: docker compose up -d --build

      - name: Wait for all service health endpoints
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:3000/health >/dev/null \
              && curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:3001/health >/dev/null \
              && curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:3002/health >/dev/null \
              && curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:3003/health >/dev/null; then
              echo "Backend and all three panels are healthy."
              exit 0
            fi
            if (( attempt % 6 == 0 )); then
              echo "Waiting for service health (attempt ${attempt}/36)."
              docker compose ps
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color postgres backend website company admin
          exit 1

      - name: Verify all migrations are applied to PostgreSQL
        run: docker compose exec -T backend npx prisma migrate status

      - name: Install isolated browser-test dependency
        run: npm install --prefix e2e --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        timeout-minutes: 10
        run: cd e2e && npx playwright install chromium

      - name: Run browser smoke tests against all panels and API proxies
        run: npm --prefix e2e test
        env:
          CI: true
          WEBSITE_URL: http://localhost:3001/
          COMPANY_URL: http://localhost:3002/
          ADMIN_URL: http://localhost:3003/
          E2E_ADMIN_PHONE: "09120000000"
          E2E_ADMIN_PASSWORD: Admin@123456

      - name: Collect service logs on failure
        if: failure()
        shell: bash
        run: |
          if [ -f .env ]; then docker compose logs --no-color postgres backend website company admin; fi

      - name: Tear down disposable environment
        if: always()
        shell: bash
        run: |
          if [ -f .env ]; then docker compose down -v; fi


  development-seed:
    name: Development seed validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare development environment
        run: cp backend/.env.example backend/.env

      - name: Validate development Compose configuration
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Start isolated PostgreSQL
        run: docker compose -f docker-compose.dev.yml up -d postgres

      - name: Rebuild development database and run repeatable seed
        run: docker compose -f docker-compose.dev.yml run --rm backend npm run db:reset:dev

      - name: Verify demo companies, accounts, categories, products and price history
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f docker-compose.dev.yml exec -T postgres psql -U telecom -d telecom_marketplace -Atqc)

          assert_count() {
            local label="$1"
            local sql="$2"
            local expected="$3"
            local actual
            actual="$(${compose[@]} "$sql")"
            echo "$label: $actual (expected $expected)"
            test "$actual" = "$expected"
          }

          assert_count "Demo companies" 'SELECT COUNT(*) FROM "Company" WHERE name IN (\'آرمان شبکه پارس\',\'پارس فیبر ایرانیان\',\'فناوران ارتباطات شرق\',\'توسعه زیرساخت هوشمند\',\'تجهیزات شبکه آریا\',\'پیشگامان مخابرات خاورمیانه\',\'بازرگانی موج نو\',\'راهکارهای ارتباطی سپهر\',\'شبکه گستران ایران\',\'ارتباطات پایدار البرز\')' 10
          assert_count "Company users" 'SELECT COUNT(*) FROM "User" WHERE phone BETWEEN \'09911000001\' AND \'09911000030\'' 30
          assert_count "Customer users" 'SELECT COUNT(*) FROM "User" WHERE phone BETWEEN \'09912000001\' AND \'09912000005\'' 5
          assert_count "Company accounts with three distinct scoped roles" 'SELECT COUNT(*) FROM (SELECT ap."companyId" FROM "AccessProfile" ap JOIN "User" u ON u.id = ap."userId" JOIN "UserRole" ur ON ur."userId" = u.id JOIN "Role" r ON r.id = ur."roleId" WHERE u.phone BETWEEN \'09911000001\' AND \'09911000030\' GROUP BY ap."companyId" HAVING COUNT(DISTINCT r.name) = 3) q' 10
          assert_count "Demo product listings" 'SELECT COUNT(*) FROM "Product" WHERE slug LIKE \'demo-%\'' 150
          assert_count "Distinct shared catalog identities" 'SELECT COUNT(DISTINCT "catalogCode") FROM "Product" WHERE slug LIKE \'demo-%\'' 75
          assert_count "Models listed by two suppliers" 'SELECT COUNT(*) FROM (SELECT "catalogCode" FROM "Product" WHERE slug LIKE \'demo-%\' GROUP BY "catalogCode" HAVING COUNT(DISTINCT "companyId") = 2) q' 75
          assert_count "Categories with ten listings" 'SELECT COUNT(*) FROM (SELECT "categoryId" FROM "Product" WHERE slug LIKE \'demo-%\' GROUP BY "categoryId" HAVING COUNT(*) = 10) q' 15
          assert_count "Six-month price snapshots" 'SELECT COUNT(*) FROM "ProductPriceSnapshot" WHERE action = \'DEMO_SEED\'' 900

      - name: Tear down development database
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
