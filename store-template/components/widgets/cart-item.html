<div class="cart-row {{mode}}" data-row="{{id}}"><div class="thumb"><img src="{{img}}" alt=""></div>
<div class="grow"><small style="color:{{bc}}">{{brand}}</small><div><b>{{name}}</b></div><small class="muted">{{color}} {{size}}</small>
<div class="cm-only" style="display:none"><span class="muted fs-12">تعداد: {{q}} × {{price}}</span></div></div>
<div class="cm-big"><div class="qty"><button data-dec="{{id}}" aria-label="کم">−</button><span>{{q}}</span><button data-inc="{{id}}" aria-label="زیاد">+</button></div><b style="display:block;text-align:end;margin-top:6px">{{total}} <small class="muted">تومان</small></b></div>
<div class="cm-mini"><b>{{total}}</b><button data-del-mini="{{id}}" class="muted" style="background:none;border:0" aria-label="حذف">×</button></div>
<div class="cart-foot cm-big">{{stock}}<span class="grow"></span><button class="btn sm btn-light" data-del="{{id}}">{{icon:trash}} حذف</button><button class="btn sm btn-light" data-later="{{id}}">{{icon:heart}} ذخیره برای بعد</button></div></div>
