<article class="card" style="padding:7px 7px 12px"><a href="{{href}}"><div style="background:var(--light);border-radius:4px"><img src="{{img}}" alt="{{name}}" loading="lazy"></div></a>
<div style="padding:12px 10px 0"><h4 style="font-size:14px;margin-bottom:6px">{{name}}</h4><div class="d-flex jc-b ai-c" style="margin-bottom:10px"><div><b style="font-size:15px">{{price}}</b> <s class="muted fs-12">{{old}}</s></div><span class="stars">{{stars}}</span></div>
<button class="btn btn-primary-t block" data-add="{{id}}">{{icon:cart}} افزودن به سبد</button></div></article>
