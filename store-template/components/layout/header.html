<header class="header">
  <button class="icon-btn menu-toggle" data-toggle="sidebar" aria-label="منو">{{icon:menu}}</button>
  <div class="h-search"><input type="search" placeholder="جستجوی نتایج..." aria-label="جستجو">{{icon:search}}</div>
  <div class="h-actions">
    <button class="icon-btn hide-sm" title="زبان" aria-label="زبان">{{icon:lang}}</button>
    <button class="icon-btn" data-toggle="theme" title="حالت تیره" aria-label="حالت تیره">{{icon:moon}}</button>
    <div data-component="dropdowns/cart-dropdown"></div>
    <div data-component="dropdowns/notifications-dropdown"></div>
    <button class="icon-btn hide-sm" data-toggle="fullscreen" aria-label="تمام‌صفحه">{{icon:expand}}</button>
    <div data-component="dropdowns/profile-dropdown"></div>
    <button class="icon-btn hide-sm" aria-label="تنظیمات" onclick="location.href='{{root}}admin/settings.html'">{{icon:settings}}</button>
  </div>
</header>
