<!DOCTYPE html>
<html lang="en" dir="rtl"><head><meta charset="utf-8"><title>Shop</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.sh-top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;margin-bottom:24px}
.sh-top .cnt{font-size:20px}.sh-top .cnt b{font-weight:600}
.sh-wrap{display:grid;grid-template-columns:1fr 386px;gap:24px;align-items:start}
.sh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.sh-c{padding:8px 8px 14px}
.sh-im{height:223px;position:relative;display:flex;align-items:center;justify-content:center;font-size:96px;margin-bottom:12px}
.sh-bd{position:absolute;top:8px;inset-inline-start:8px;color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px;font-family:DM Sans}
.sh-c h5{font-size:17px;font-weight:500;padding:6px 8px 4px;direction:ltr;text-align:left}
.sh-r{display:flex;justify-content:space-between;align-items:flex-start;padding:0 8px;direction:ltr}
.sh-r .l{font-size:13px}.sh-r .l small{display:block;color:#8a90a6;font-size:11px;margin-top:5px}.sh-r .l small b{color:#f5a623;font-weight:400;letter-spacing:1px;margin-right:4px}
.sh-r .l span{display:block;margin-top:12px}
.sh-r .p{text-align:right}.sh-r .p b{font-size:21px;font-weight:500;display:block}.sh-r .p s{font-size:11px;color:#8a90a6;display:block;margin-top:8px}
.sh-add{margin:12px 8px 0;background:#f4f5fa;text-align:center;padding:11px;border-radius:3px;font-size:14px}
.sh-f{padding:0}.sh-f .sec{padding:24px;border-bottom:1px solid #eceef5}.sh-f h4{font-size:17px;font-weight:500;margin-bottom:16px}
.sh-f .rw{display:flex;align-items:center;gap:10px;font-size:13px;margin:12px 0 0}
.sh-f .rw i{width:14px;height:14px;border:1px solid #dcdfea;border-radius:3px;display:inline-block}
.sh-f .sl2{height:4px;background:#eceef5;border-radius:2px;position:relative;margin:24px 0 24px}.sh-f .sl2 i{position:absolute;inset-inline-start:0;width:84%;height:4px;background:#7c6cf6}
.sh-f .pr{display:flex;gap:14px;align-items:center;font-size:14px}.sh-f .pr span{border:1px solid #e3e5ee;border-radius:3px;padding:9px 16px}
.sh-f .dots{display:flex;gap:12px;margin-top:20px}.sh-f .dots span{width:18px;height:18px;border-radius:50%}
.sh-f .sx{border:1px solid #e3e5ee;border-radius:3px;padding:11px 14px;color:#8a90a6;font-size:13px;display:flex;justify-content:space-between}
.sh-f .ac{display:flex;gap:12px;padding:20px 24px}
</style></head>
<body data-layout="myron" data-menu="Pages>Shop"><div class="page">
<div class="card sh-top"><div class="cnt">Showing <b>3456</b> Items</div>
<div style="display:flex;border:1px solid #e3e5ee;border-radius:3px;padding:4px;width:793px"><input style="border:0;flex:1" placeholder="Search Product.."><button class="btn btn-p" style="padding:8px 15px;font-size:13px">Search</button></div>
<div class="sel" style="color:#1d2130;gap:12px">⇅ Sort By ⌵</div></div>
<div class="sh-wrap">
<div class="sh-grid" id="grid"></div>
<div class="card sh-f">
<div class="sec"><h4>Categories</h4><input style="width:100%;margin-bottom:6px" placeholder="Search"><div class="rw"><i></i>All Items</div><div class="rw"><i></i>Women</div><div class="rw"><i></i>Men</div><div class="rw"><i></i>Kids</div><div class="rw"><a>View All</a></div></div>
<div class="sec"><h4>Price Range</h4><div class="sl2"><i></i></div><div class="pr"><span>$8000.00</span>-<span>$40000.00</span></div></div>
<div class="sec"><h4>Sizes</h4><div class="sx">Select Size <span>▾</span></div></div>
<div class="sec"><h4>Brand</h4><div class="sx">Select Size <span>▾</span></div></div>
<div class="sec" style="border:0"><h4>Color</h4><div class="dots"><span style="border:2px solid #7c6cf6;box-shadow:inset 0 0 0 2px #fff;background:#7c6cf6"></span><span style="background:#ff6a3d"></span><span style="background:#f0453a"></span><span style="background:#f5a623"></span><span style="background:#22c55e"></span><span style="background:#8b7cf8"></span><span style="background:#14d1c4"></span><span style="background:#2b8ff0"></span><span style="background:#ff5fa8"></span></div></div>
<div class="ac"><span class="btn btn-exp" style="background:#ff5b2e;color:#fff">Clear All</span><span class="btn btn-p">Apply</span></div>
</div></div></div>
<script>
var P=[['24% Off','#7c6cf6','#e8e2fb','🛋️','Lightweight Sofa','563','Patagonia','$11846','$12957'],
['75% Off','#ff6a3d','#fde4dc','📷','Altra Pro Max Camera','235','Stella McCartney','$2965','$3675'],
['92% Off','#22c55e','#d9f5e5','🧴','Perfume','1025','Reformation','$256','$345'],
['35% Off','#2b8ff0','#d6edfa','⏰','Alaram Clock','674','Supreme','$974','$1200'],
['25% Off','#f5a623','#fdf0d9','👞','Lightweight Sneakers','874','Stealth Series','$771','$880'],
['54% Off','#14c8b4','#d4f7f5','🎧','Samsung Headset','874','Givenchy','$11,856','$12,764'],
['43% Off','#ff5fa8','#fde0ec','👜','Ladies Stylish Hand bag','453','Balenciaga','$640','$999'],
['37% Off','#f0453a','#ffdde0','🌹','Flower Pot','12','Louis Vuitton','$499','$540']],h='';
P.forEach(function(p){h+='<div class="card sh-c"><div class="sh-im" style="background:'+p[2]+'"><span class="sh-bd" style="background:'+p[1]+'">'+p[0]+'</span>'+p[3]+'</div><h5>'+p[4]+'</h5><div class="sh-r"><div class="l"><small><b>★★★★☆</b>('+p[5]+') Ratings</small><span>'+p[6]+'</span></div><div class="p"><b>'+p[7]+'</b><s>'+p[8]+'</s></div></div><div class="sh-add">Add to Cart</div></div>'});
document.getElementById('grid').innerHTML=h;
</script>
<script src="layout.js"></script></body></html>
