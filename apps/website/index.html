<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="بازار آنلاین تجهیزات مخابراتی - Telecom Marketplace" />
    <script>
      try {
        if (localStorage.getItem('dashboard.theme') === 'dark') document.documentElement.classList.add('app-dark');
      } catch {}
    </script>
    <style>
      #page-loading {
        position: fixed; inset: 0; z-index: 99999; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        overflow: hidden; background: #060D17; color: #FFFFFF;
        opacity: 1; visibility: visible; transition: opacity .4s ease, visibility .4s ease;
      }
      #page-loading.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .fiber-loader-svg { display: block; width: min(500px, 92vw); height: auto; }
      .fiber-loader-svg .fiber-node { fill: #0E1E30; stroke: #22D3EE; stroke-width: 2.5; }
      .fiber-loader-svg .fiber-node--core { fill: #122438; stroke: #8B5CF6; stroke-width: 2.5; }
      .fiber-loader-svg .fiber-track { fill: none; stroke: #1E3A5F; stroke-width: 3; }
      .fiber-loader-svg .fiber-flow { fill: none; stroke-linecap: round; stroke-dasharray: 15 120; animation: fiber-transmit 1.2s linear infinite; }
      .fiber-loader-svg .fiber-flow--cyan { stroke: #22D3EE; stroke-width: 4; }
      .fiber-loader-svg .fiber-flow--violet { stroke: #8B5CF6; stroke-width: 3.5; animation-duration: 1.4s; }
      .fiber-loader-svg .fiber-flow--middle { stroke: #22D3EE; stroke-width: 3.5; animation-duration: 1s; }
      .fiber-loader-svg .fiber-led { fill: #22C55E; }
      .wait-text { margin-top: 20px; color: #67E8F9; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 16px; font-weight: 600; animation: fiber-text-pulse 1.5s ease-in-out infinite alternate; }
      @keyframes fiber-transmit { from { stroke-dashoffset: 135; } to { stroke-dashoffset: 0; } }
      @keyframes fiber-text-pulse { from { opacity: .65; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .fiber-loader-svg .fiber-flow, .wait-text { animation: none !important; }
      }
    </style>
    <title>Telecom Marketplace</title>
    <!-- Body font is Vazirmatn, bundled locally (see @telecom/shared-ui
         NewCSS/layout/_core.scss). No Google Fonts request is needed — the
         previous Inter <link> only added a render-blocking round-trip for a
         font the Persian UI never actually used. -->
  </head>
  <body>
    <div id="app" aria-busy="true"></div>
    <div id="page-loading" role="status" aria-live="polite" aria-label="در حال بارگذاری">
      <svg class="fiber-loader-svg" viewBox="0 0 500 240" fill="none" aria-hidden="true">
        <rect class="fiber-node" x="35" y="80" width="80" height="80" rx="12"/>
        <rect x="45" y="95" width="40" height="8" rx="2" fill="#22D3EE"/>
        <rect x="45" y="110" width="25" height="8" rx="2" fill="#6366F1"/>
        <circle class="fiber-led" cx="100" cy="99" r="4"/>
        <polygon class="fiber-node--core" points="250,70 290,120 250,170 210,120"/>
        <rect class="fiber-node" x="385" y="30" width="65" height="50" rx="8"/>
        <rect class="fiber-node" x="385" y="95" width="65" height="50" rx="8"/>
        <rect class="fiber-node" x="385" y="160" width="65" height="50" rx="8"/>
        <path class="fiber-track" d="M115 120 L210 120"/>
        <path class="fiber-track" d="M290 120 L385 55"/>
        <path class="fiber-track" d="M290 120 L385 120"/>
        <path class="fiber-track" d="M290 120 L385 185"/>
        <path class="fiber-flow fiber-flow--cyan" d="M115 120 L210 120"/>
        <path class="fiber-flow fiber-flow--violet" d="M290 120 L385 55"/>
        <path class="fiber-flow fiber-flow--middle" d="M290 120 L385 120"/>
      </svg>
      <div class="wait-text">لطفا منتظر بمانید...</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
