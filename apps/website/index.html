<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="بازار آنلاین تجهیزات مخابراتی - Telecom Marketplace" />
    <style>
      #page-loading {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        background: #f4f5fa;
        color: #12182b;
        opacity: 1;
        visibility: visible;
        transition: opacity 360ms ease, visibility 360ms ease;
      }
      #page-loading.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .fiber-loader__content {
        width: min(520px, 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .fiber-loader__brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 34px;
        direction: ltr;
        font: 800 17px/1.2 Vazirmatn, Tahoma, sans-serif;
        letter-spacing: -.35px;
      }
      .fiber-loader__brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #2aa7e8, #6c5ce7);
        box-shadow: 0 7px 22px rgba(42, 167, 232, .2);
      }
      .fiber-loader__visual {
        position: relative;
        width: min(460px, 88vw);
        height: 116px;
        display: grid;
        place-items: center;
        margin-bottom: 20px;
        isolation: isolate;
      }
      .fiber-loader__visual::before {
        content: "";
        position: absolute;
        inset: 20px 5%;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(42, 167, 232, .13), transparent 68%);
        filter: blur(12px);
        z-index: -1;
      }
      .fiber-loader__svg { width: 100%; height: 100%; overflow: visible; }
      .fiber-loader__cable {
        fill: none;
        stroke: #d9e2f3;
        stroke-width: 13;
        stroke-linecap: round;
      }
      .fiber-loader__core {
        fill: none;
        stroke: url(#fiber-gradient);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 8 13;
        animation: fiber-data-flow 1.05s linear infinite;
      }
      .fiber-loader__glow {
        fill: none;
        stroke: #46c8f3;
        stroke-width: 8;
        stroke-linecap: round;
        opacity: .18;
        filter: url(#fiber-glow);
      }
      .fiber-loader__packet {
        fill: #fff;
        stroke: #2aa7e8;
        stroke-width: 3;
        filter: url(#fiber-glow);
        animation: fiber-packet-travel 1.65s ease-in-out infinite;
      }
      .fiber-loader__packet--two { animation-delay: -.55s; }
      .fiber-loader__packet--three { animation-delay: -1.1s; }
      .fiber-loader__node { fill: #6c5ce7; stroke: #fff; stroke-width: 4; }
      .fiber-loader__title {
        margin: 0;
        font: 700 17px/1.8 Vazirmatn, Tahoma, sans-serif;
        color: #202943;
      }
      .fiber-loader__caption {
        margin: 5px 0 0;
        color: #78829e;
        font: 400 12px/1.9 Vazirmatn, Tahoma, sans-serif;
      }
      .fiber-loader__signal {
        display: flex;
        gap: 5px;
        margin-top: 19px;
      }
      .fiber-loader__signal span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #2aa7e8;
        animation: fiber-signal 1s ease-in-out infinite;
      }
      .fiber-loader__signal span:nth-child(2) { animation-delay: .15s; }
      .fiber-loader__signal span:nth-child(3) { animation-delay: .3s; }
      @keyframes fiber-data-flow { to { stroke-dashoffset: -42; } }
      @keyframes fiber-packet-travel {
        0% { transform: translateX(0); opacity: 0; }
        12% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(330px); opacity: 0; }
      }
      @keyframes fiber-signal {
        0%, 80%, 100% { transform: translateY(0); opacity: .35; }
        40% { transform: translateY(-4px); opacity: 1; }
      }
      @media (prefers-color-scheme: dark) {
        #page-loading { background: #0e1220; color: #eef0f8; }
        .fiber-loader__cable { stroke: #252e49; }
        .fiber-loader__title { color: #eef0f8; }
        .fiber-loader__caption { color: #9aa3c2; }
      }
      @media (prefers-reduced-motion: reduce) {
        .fiber-loader__core,
        .fiber-loader__packet,
        .fiber-loader__signal span { animation: none !important; }
        .fiber-loader__packet { opacity: 1; }
        #page-loading { transition: none; }
      }
    </style>
    <title>Telecom Marketplace</title>
    <!-- Body font is Vazirmatn, bundled locally (see @telecom/shared-ui
         NewCSS/layout/_core.scss). No Google Fonts request is needed — the
         previous Inter <link> only added a render-blocking round-trip for a
         font the Persian UI never actually used. -->
  </head>
  <body>
    <div id="app" aria-busy="true"></div>
    <div id="page-loading" role="status" aria-live="polite" aria-label="در حال بارگذاری صفحه">
      <div class="fiber-loader__content">
        <div class="fiber-loader__brand" aria-hidden="true">
          <span class="fiber-loader__brand-mark"></span>
          <span>Telecom Market</span>
        </div>
        <div class="fiber-loader__visual" aria-hidden="true">
          <svg class="fiber-loader__svg" viewBox="0 0 460 116" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="fiber-gradient" x1="0" x2="1">
                <stop offset="0" stop-color="#6c5ce7" />
                <stop offset=".52" stop-color="#2aa7e8" />
                <stop offset="1" stop-color="#54d8ef" />
              </linearGradient>
              <filter id="fiber-glow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="4" />
              </filter>
            </defs>
            <path class="fiber-loader__cable" d="M35 58 H425" />
            <path class="fiber-loader__glow" d="M35 58 H425" />
            <path class="fiber-loader__core" d="M35 58 H425" />
            <circle class="fiber-loader__node" cx="35" cy="58" r="8" />
            <circle class="fiber-loader__node" cx="425" cy="58" r="8" />
            <circle class="fiber-loader__packet" cx="45" cy="58" r="5" />
            <circle class="fiber-loader__packet fiber-loader__packet--two" cx="45" cy="58" r="4" />
            <circle class="fiber-loader__packet fiber-loader__packet--three" cx="45" cy="58" r="3" />
          </svg>
        </div>
        <p class="fiber-loader__title">در حال انتقال داده‌ها از بستر فیبر نوری</p>
        <p class="fiber-loader__caption">در حال برقراری ارتباط امن با بازارگاه تجهیزات مخابراتی</p>
        <div class="fiber-loader__signal" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
