<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="بازار آنلاین تجهیزات مخابراتی - Telecom Marketplace" />
    <style>
      #page-loading {
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center;
        overflow: hidden; background: #F8FAFC; opacity: 1; visibility: visible;
        transition: opacity 300ms ease, visibility 300ms ease;
      }
      #page-loading.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .fiber-loader__visual { width: clamp(104px, 22vw, 136px); aspect-ratio: 1; filter: drop-shadow(0 0 18px rgba(34,211,238,.16)); }
      .fiber-loader__svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .fiber-loader__track { fill: none; stroke: #dce6ef; stroke-width: 5; }
      .fiber-loader__halo { fill: none; stroke: #22D3EE; stroke-width: 8; opacity: .24; filter: url(#fiber-glow); }
      .fiber-loader__flow {
        fill: none; stroke: url(#fiber-gradient); stroke-width: 4; stroke-linecap: round;
        stroke-dasharray: 18 82; transform-origin: 60px 60px; animation: fiber-orbit 1.35s linear infinite; filter: url(#fiber-glow);
      }
      .fiber-loader__inner {
        fill: none; stroke: #7b8fa8; stroke-width: 1.5; stroke-dasharray: 2 7;
        opacity: .55; animation: fiber-orbit-reverse 4.5s linear infinite;
      }
      .fiber-loader__packets { transform-origin: 60px 60px; animation: fiber-orbit 2.1s linear infinite; }
      .fiber-loader__packet { fill: #fff; stroke: #22D3EE; stroke-width: 2; filter: url(#fiber-glow); }
      .fiber-loader__packet--secondary { fill: #c9ffff; stroke: #0891B2; stroke-width: 1.5; }
      .fiber-loader__core-halo {
        fill: #22D3EE; opacity: .18; filter: url(#fiber-glow);
        transform-origin: 60px 60px; animation: fiber-pulse 1.7s ease-in-out infinite;
      }
      .fiber-loader__core { fill: url(#fiber-center); stroke: #fff; stroke-width: 2; }
      @keyframes fiber-orbit { to { stroke-dashoffset: -100; transform: rotate(360deg); } }
      @keyframes fiber-orbit-reverse { to { transform: rotate(-360deg); } }
      @keyframes fiber-pulse {
        0%,100% { opacity: .12; transform: scale(.86); }
        50% { opacity: .34; transform: scale(1.18); }
      }
      @media (prefers-color-scheme: dark) {
        #page-loading { background: #0A1625; }
        .fiber-loader__track { stroke: #26384B; }
        .fiber-loader__inner { stroke: #9FB3C8; opacity: .42; }
      }
      @media (prefers-reduced-motion: reduce) {
        .fiber-loader__flow, .fiber-loader__inner, .fiber-loader__packets, .fiber-loader__core-halo { animation: none !important; }
        .fiber-loader__flow { stroke-dasharray: 30 70; }
      }
    </style>
    <title>Telecom Marketplace</title>
    <!-- Body font is Vazirmatn, bundled locally (see @telecom/shared-ui
         NewCSS/layout/_core.scss). No Google Fonts request is needed — the
         previous Inter <link> only added a render-blocking round-trip for a
         font the Persian UI never actually used. -->
  </head>
  <body>
    <div id="app" aria-busy="true"></div>
    <div id="page-loading" role="status" aria-live="polite" aria-label="در حال بارگذاری">
      <div class="fiber-loader__visual" aria-hidden="true">
        <svg class="fiber-loader__svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="fiber-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#22D3EE" />
              <stop offset=".55" stop-color="#06B6D4" />
              <stop offset="1" stop-color="#8B5CF6" />
            </linearGradient>
            <radialGradient id="fiber-center">
              <stop offset="0" stop-color="#fff" />
              <stop offset=".45" stop-color="#b9ffff" />
              <stop offset="1" stop-color="#22D3EE" />
            </radialGradient>
            <filter id="fiber-glow" x="-150%" y="-150%" width="400%" height="400%">
              <feGaussianBlur stdDeviation="3.5" />
            </filter>
          </defs>
          <circle class="fiber-loader__track" cx="60" cy="60" r="43" />
          <circle class="fiber-loader__halo" cx="60" cy="60" r="43" />
          <circle class="fiber-loader__flow" cx="60" cy="60" r="43" pathLength="100" />
          <circle class="fiber-loader__inner" cx="60" cy="60" r="29" />
          <g class="fiber-loader__packets">
            <circle class="fiber-loader__packet" cx="60" cy="17" r="4" />
            <circle class="fiber-loader__packet fiber-loader__packet--secondary" cx="60" cy="17" r="2.5" transform="rotate(120 60 60)" />
            <circle class="fiber-loader__packet" cx="60" cy="17" r="2.8" transform="rotate(240 60 60)" />
          </g>
          <circle class="fiber-loader__core-halo" cx="60" cy="60" r="8" />
          <circle class="fiber-loader__core" cx="60" cy="60" r="5" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
