# =============================================================
# Docker Compose - Production
# اجرا:
# docker compose up -d --build
# =============================================================

services:

  # ────────────────────────────────────────────────────────────
  # PostgreSQL
  # ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18.4-bookworm
    container_name: telecom_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telecom_pass}
      POSTGRES_DB: ${POSTGRES_DB:-telecom_marketplace}

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telecom} -d ${POSTGRES_DB:-telecom_marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - telecom_net

  # ────────────────────────────────────────────────────────────
  # Backend (Fastify)
  # ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: telecom_backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom_pass}@postgres:5432/${POSTGRES_DB:-telecom_marketplace}?schema=public

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - telecom_net

  # ────────────────────────────────────────────────────────────
  # Website (Public marketplace)
  # ────────────────────────────────────────────────────────────
  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile

    container_name: telecom_website
    restart: unless-stopped

    ports:
      - "3001:80"

    depends_on:
      - backend

    networks:
      - telecom_net

  # ────────────────────────────────────────────────────────────
  # Company portal
  # ────────────────────────────────────────────────────────────
  company:
    build:
      context: .
      dockerfile: apps/company/Dockerfile

    container_name: telecom_company
    restart: unless-stopped

    ports:
      - "3002:80"

    depends_on:
      - backend

    networks:
      - telecom_net

  # ────────────────────────────────────────────────────────────
  # Admin portal
  # ────────────────────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile

    container_name: telecom_admin
    restart: unless-stopped

    ports:
      - "3003:80"

    depends_on:
      - backend

    networks:
      - telecom_net

networks:
  telecom_net:
    driver: bridge

volumes:
  postgres_data:
